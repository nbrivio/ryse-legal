<title>Ryse App – Rechtliches</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    background: #FFFAF5;
    color: #1A0C04;
    padding: 2rem 1.25rem;
    max-width: 680px;
    margin: 0 auto;
    line-height: 1.7;
  }
  header { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid #F0956A33; text-align: center; }
  header h1 { font-size: 1.75rem; font-weight: 700; color: #1A0C04; letter-spacing: -0.02em; }
  header p { font-size: 0.9rem; color: #8C7A6A; margin-top: 0.5rem; }
  .links { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; }
  .links a {
    display: block;
    padding: 1rem 1.25rem;
    background: #fff;
    border: 1px solid #F0956A33;
    border-radius: 12px;
    color: #1A0C04;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .links a:hover {
    border-color: #EA7920;
    box-shadow: 0 2px 8px #EA792020;
  }
  .links a span { display: block; font-size: 0.85rem; font-weight: 400; color: #8C7A6A; margin-top: 0.25rem; }
  footer { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid #F0956A33; font-size: 0.8rem; color: #8C7A6A; text-align: center; }
  @media (prefers-color-scheme: dark) {
    body { background: #0a0a0a; color: #E8DCD0; }
    header h1 { color: #F5F0EB; }
    header p, footer { color: #6B5D50; }
    header, footer { border-color: #2A2218; }
    .links a { background: #141414; border-color: #2A2218; color: #F5F0EB; }
    .links a:hover { border-color: #EA7920; }
    .links a span { color: #6B5D50; }
  }
</style>
